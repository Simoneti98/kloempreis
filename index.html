[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: smalle reiskolom — kop met route-strook, daarna één rij per dag (datumkolom + inhoud), transportdagen krijgen een waterblauwe band. */
:root {
  --paper: #F2F5F1;
  --card: #FFFFFF;
  --ink: #17302B;
  --muted: #5B6F68;
  --line: #D6DED9;
  --saffron: #D9801A;
  --saffron-soft: #FBEBD5;
  --saffron-ink: #8F520A;
  --water: #276F7A;
  --water-soft: #E1EFF1;
  --danger: #B3402A;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1917; --card: #152320; --ink: #E5EEEA; --muted: #95A9A2; --line: #26392F;
    --saffron: #F0A245; --saffron-soft: #3A2A14; --saffron-ink: #F6C27F;
    --water: #6BBAC5; --water-soft: #17333A; --danger: #EE8670; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1917; --card: #152320; --ink: #E5EEEA; --muted: #95A9A2; --line: #26392F;
  --saffron: #F0A245; --saffron-soft: #3A2A14; --saffron-ink: #F6C27F;
  --water: #6BBAC5; --water-soft: #17333A; --danger: #EE8670; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; }

header { display: grid; gap: 18px; margin-bottom: 36px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--saffron-ink); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 8vw, 64px); line-height: 1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 16px; }

.route { overflow-x: auto; padding-bottom: 4px; }
.route ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: stretch; gap: 0; min-width: max-content; }
.route li { display: flex; align-items: center; }
.stop { display: grid; gap: 2px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.stop b { font-weight: 600; font-size: 14px; white-space: nowrap; }
.stop span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.hop { width: 28px; height: 2px; background: repeating-linear-gradient(90deg, var(--water) 0 5px, transparent 5px 9px); flex: none; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.status { font-size: 13px; color: var(--muted); }

button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 12px; font-size: 14px; font-weight: 500; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
button.ghost:hover { color: var(--ink); border-color: var(--line); }
button.danger { color: var(--danger); }

.days { display: grid; gap: 0; border-top: 1px solid var(--line); }
.day { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 18px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.date { display: grid; align-content: start; gap: 2px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.date .dow { font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.date .num { font-size: 30px; font-weight: 600; line-height: 1; }
.date .mon { font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.date .dn { margin-top: 8px; font-size: 11px; color: var(--saffron-ink); }

.body { display: grid; gap: 12px; min-width: 0; }
.head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.place { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.place-detail { color: var(--muted); }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; font-weight: 600; }
.val { min-width: 0; overflow-wrap: anywhere; }
.val ul { margin: 0; padding-left: 18px; }
.val li::marker { color: var(--saffron); }
.empty { color: var(--muted); font-style: italic; }
.stay { display: inline-flex; gap: 6px; align-items: center; background: var(--saffron-soft); color: var(--saffron-ink); padding: 3px 9px; border-radius: 6px; font-weight: 600; text-decoration: none; }
.stay svg { flex: none; }
a.stay:hover { text-decoration: underline; }
a.stay:focus-visible, .addr:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.addr-text { color: var(--muted); font-size: 14px; }
.transport { display: flex; gap: 10px; align-items: flex-start; background: var(--water-soft); color: var(--ink); border-radius: 8px; padding: 9px 12px; }
.transport svg { flex: none; color: var(--water); margin-top: 2px; }
.notes { color: var(--muted); font-size: 14px; white-space: pre-wrap; }

form.edit { display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field small { font-size: 12px; color: var(--muted); }
input, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 76px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.actions div { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 13px; }

.notice { padding: 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
.adder { margin-top: 18px; }

@media (max-width: 560px) {
  .day { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
  .date .num { font-size: 24px; }
  .row { grid-template-columns: 1fr; gap: 2px; }
  .place { font-size: 21px; }
}
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.slot { display: grid; align-content: start; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; min-width: 0; }
.slot-t { display: flex; gap: 7px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.slot-t svg { flex: none; }
.slot.am .slot-t svg { color: var(--saffron); }
.slot.pm .slot-t svg { color: var(--saffron-ink); }
.slot.ev .slot-t svg { color: var(--water); }
.slot.allday .slot-t svg { color: var(--muted); }
.slot ul { margin: 0; padding: 0; list-style: none; display: grid; }
.slot li { font-size: 15px; font-weight: 500; line-height: 1.35; padding-block: 6px; overflow-wrap: anywhere; }
.slot li + li { border-top: 1px dashed var(--line); }
.slot li:first-child { padding-top: 0; }
.slot li:last-child { padding-bottom: 0; }
.slotgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .slotgrid { grid-template-columns: 1fr; } }
body.exporting #dlBtn, body.exporting #modeBtn, body.exporting .banner, body.exporting .adder, body.exporting .ghost, body.exporting .codeform, body.exporting .status { display: none !important; }
body.exporting .route { overflow: visible; }
body.exporting .route ol { flex-wrap: wrap; min-width: 0; row-gap: 8px; }
body.exporting .wrap { padding-block: 16px; }
@media print {
  #dlBtn, #modeBtn, .banner, .adder, .ghost, .codeform, .status { display: none !important; }
  .route { overflow: visible; } .route ol { flex-wrap: wrap; min-width: 0; row-gap: 8px; }
  .day { break-inside: avoid; }
}
/* Reisdocumenten */
.docs { margin-top: 48px; display: grid; gap: 14px; }
.docs-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.docs-title { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; }
.docs-head .ghost { display: inline-flex; gap: 6px; align-items: center; }
.docs-lock { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.docs-lock-icon { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--saffron-soft); color: var(--saffron-ink); }
.docs-lock-body { display: grid; gap: 10px; min-width: 0; flex: 1; }
.docs-lock-row { display: flex; gap: 8px; flex-wrap: wrap; }
.docs-lock-row input { flex: 1 1 180px; max-width: 280px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.person { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; align-content: start; gap: 4px; min-width: 0; }
.person h3 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.docrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; flex-wrap: wrap; }
.docrow + .docrow { border-top: 1px dashed var(--line); }
.docinfo { display: grid; gap: 2px; min-width: 0; }
.doclabel { font-weight: 600; font-size: 14px; }
.docmeta { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--water); }
.docmeta.empty { color: var(--muted); font-style: italic; }
.docbtns { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.docbtns button { padding: 5px 10px; font-size: 13px; }
.docs-note { color: var(--muted); font-size: 13px; margin: 0; }
.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 18, .72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.viewer-card { background: var(--card); color: var(--ink); border-radius: 14px; width: min(960px, 100%); max-height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.viewer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.viewer-body { overflow: auto; padding: 14px; display: grid; place-items: center; }
.viewer-body img { max-width: 100%; max-height: 75vh; border-radius: 8px; }
.btnlink { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; background: var(--card); }
.btnlink:hover { border-color: var(--muted); }
body.exporting .docs, body.exporting .viewer { display: none !important; }
@media print { .docs, .viewer { display: none !important; } }
.stayline { display: grid; gap: 4px; justify-items: start; }
.addr { display: inline-flex; gap: 6px; align-items: flex-start; color: var(--water); font-size: 14px; text-decoration: none; }
.addr:hover { text-decoration: underline; }
.addr svg { flex: none; margin-top: 2px; }
.banner { display: grid; gap: 4px; background: var(--saffron-soft); color: var(--saffron-ink); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.editbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.codeform { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.codeform input { width: 180px; padding: 6px 10px; }
.live { display: inline-flex; gap: 6px; align-items: center; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--water); }

</head>

try { code = localStorage.getItem(CODE_KEY); } catch {}

function sortDays(a) { return a.slice().sort((x, y) => x.date.localeCompare(y.date)); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function parse(d) { const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd); }
function lines(t) { return String(t || "").split("\n").map(s => s.trim()).filter(Boolean); }
function mapsUrl(d) {
  const a = (d.address || "").trim();
  if (/^https?:\/\//i.test(a)) return a;
  // Zonder link zoekt Maps altijd binnen Cambodja.
  const q = [d.stay, a].filter(Boolean).join(", ");
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(/cambod/i.test(q) ? q : q + ", Cambodia");
}
function addrLabel(a) { return /^https?:\/\//i.test(a) ? "Open in Google Maps" : a; }
function banner(msg) { const b = $("banner"); b.innerHTML = msg || ""; b.hidden = !msg; }
function status(msg, live) { const s = $("status"); s.textContent = msg || ""; s.className = "status" + (live ? " live" : ""); }

/* "Tuk Tuk Tour (wandeling)" → naam "Tuk Tuk Tour" voor de route, detail "wandeling" onder de titel. */
function splitPlace(place) {
  const s = String(place || "").trim();
  const m = s.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  return m && m[1] ? { name: m[1].trim(), detail: m[2].trim() } : { name: s, detail: "" };
}
function placeHtml(place) {
  const { name, detail } = splitPlace(place);
  if (!name) return "Plaats nog in te vullen";
  return esc(name) + (detail ? ` <span class="place-detail">(${esc(detail)})</span>` : "");
}

/* Waar slaap je die nacht? Staat er "A → B" bij transport, dan is dat B; anders de plaats van de dag. */
function nightPlace(d) {
  const t = String(d.transport || "");
  const i = Math.max(t.lastIndexOf("→"), t.lastIndexOf("->"));
  if (i >= 0) {
    const dest = t.slice(i + (t[i] === "→" ? 1 : 2)).split(/[,(]/)[0].trim();
    if (dest) return dest;
  }
  return splitPlace(d.place).name;
}
function shortDate(iso) { const d = parse(iso); return `${d.getDate()} ${MON[d.getMonth()]}`; }

function renderRoute() {
  // De laatste dag telt niet als nacht: dan reizen jullie naar huis.
  const nights = days.length > 1 ? days.slice(0, -1) : days;
  const stops = [];
  for (const d of nights) {
    const p = nightPlace(d) || "Onbekend";
    const last = stops[stops.length - 1];
    if (last && last.place.toLowerCase() === p.toLowerCase()) { last.n++; last.to = d.date; }
    else stops.push({ place: p, n: 1, from: d.date, to: d.date });
  }
  $("route").innerHTML = stops.map((s, i) => {
    // Van aankomst tot vertrek, zoals bij een hotelboeking: 3 nachten vanaf 7 nov = 7–10 nov.
    const a = parse(s.from), b = parse(s.to); b.setDate(b.getDate() + 1);
    const when = (a.getMonth() === b.getMonth() ? a.getDate() : `${a.getDate()} ${MON[a.getMonth()]}`) + "–" + `${b.getDate()} ${MON[b.getMonth()]}`;
    return (i ? '<li><span class="hop" aria-hidden="true"></span></li>' : "") +
      `<li><div class="stop"><b>${esc(s.place)}</b><span>${when} · ${s.n} ${s.n === 1 ? "nacht" : "nachten"}</span></div></li>`;
  }).join("");
  if (days.length) {
    const total = stops.reduce((a, s) => a + s.n, 0);
    $("sub").textContent = `${shortDate(days[0].date)} – ${shortDate(days[days.length-1].date)} · ${total} ${total === 1 ? "nacht" : "nachten"} · ${stops.length} stops`;
  }
}

function stayHtml(d) {
  if (!d.stay && !d.address) return '<span class="empty">Nog geen verblijf</span>';
  const url = esc(mapsUrl(d));
  return `<div class="stayline">
    ${d.stay ? `<a class="stay" href="${url}" target="_blank" rel="noopener" title="Open in Google Maps">${pin}<span>${esc(d.stay)}</span></a>`
             : `<a class="addr" href="${url}" target="_blank" rel="noopener">${pin}<span>${esc(addrLabel(d.address))}</span></a>`}
  </div>`;
}

const ICON = {
  am: '<path d="M3 18h18"/><path d="M7 18a5 5 0 0 1 10 0"/><path d="M12 6v3"/><path d="M5.6 10.6l1.8 1.8"/><path d="M18.4 10.6l-1.8 1.8"/>',
  pm: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  ev: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  allday: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'
};
const SLOTS = [["morning", "Voormiddag", "am"], ["afternoon", "Namiddag", "pm"], ["evening", "Avond", "ev"], ["activities", "Hele dag", "allday"]];
function slotsHtml(d) {
  const filled = SLOTS.map(([k, label, cls]) => ({ label, cls, items: lines(d[k]) })).filter(s => s.items.length);
  if (!filled.length) return '<span class="empty">Nog niets gepland</span>';
  return `<div class="slots">${filled.map(s =>
    `<div class="slot ${s.cls}"><span class="slot-t"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[s.cls]}</svg>${s.label}</span><ul>${s.items.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}

function viewDay(d, i) {
  const dt = parse(d.date);
  return `<article class="day" id="d-${esc(d.date)}">
    <div class="date">
      <span class="dow">${DOW[dt.getDay()]}</span>
      <span class="num">${String(dt.getDate()).padStart(2,"0")}</span>
      <span class="mon">${MON[dt.getMonth()]}</span>
      <span class="dn">dag ${i+1}</span>
    </div>
    <div class="body">
      ${editing === d.date ? formHtml(d) : `
      <div class="head">
        <h2 class="place">${placeHtml(d.place)}</h2>
        ${editMode ? `<button class="ghost" type="button" data-edit="${esc(d.date)}">Bewerken</button>` : ""}
      </div>
      <div class="rows">
        <div class="row"><span class="label">Verblijf</span><div class="val">${stayHtml(d)}</div></div>
        <div class="row"><span class="label">Activiteiten</span><div class="val">${slotsHtml(d)}</div></div>
        ${d.transport ? `<div class="row"><span class="label">Transport</span><div class="val"><div class="transport">${arrow}<span>${esc(d.transport)}</span></div></div></div>` : ""}
        ${d.notes ? `<div class="row"><span class="label">Notities</span><div class="val notes">${esc(d.notes)}</div></div>` : ""}
      </div>`}
    </div>
  </article>`;
}

function formHtml(d) {
  const isNew = !!d.__new, k = isNew ? "new" : d.date;
  return `<form class="edit" data-form="${esc(k)}">
    ${isNew ? `<div class="field"><label for="f-date-${k}">Datum</label><input id="f-date-${k}" name="date" type="date" required></div>` : ""}
    <div class="field"><label for="f-place-${k}">Plaats</label><input id="f-place-${k}" name="place" value="${esc(d.place)}" placeholder="bv. Siem Reap"></div>
    <div class="field"><label for="f-stay-${k}">Naam van het verblijf</label><input id="f-stay-${k}" name="stay" value="${esc(d.stay)}" placeholder="Naam hotel of guesthouse"></div>
    <div class="field"><label for="f-addr-${k}">Google Maps-link</label><input id="f-addr-${k}" name="address" value="${esc(d.address)}" placeholder="https://maps.app.goo.gl/…"><small>Klikken op de naam van het verblijf opent deze link. Leeg laten? Dan zoekt Maps de naam op in Cambodja.</small></div>
    <div class="slotgrid">
      <div class="field"><label for="f-am-${k}">Voormiddag</label><textarea id="f-am-${k}" name="morning" placeholder="bv. Zonsopgang Angkor Wat">${esc(d.morning)}</textarea></div>
      <div class="field"><label for="f-pm-${k}">Namiddag</label><textarea id="f-pm-${k}" name="afternoon" placeholder="bv. Ta Prohm">${esc(d.afternoon)}</textarea></div>
      <div class="field"><label for="f-ev-${k}">Avond</label><textarea id="f-ev-${k}" name="evening" placeholder="bv. Pub Street">${esc(d.evening)}</textarea></div>
    </div>
    <div class="field"><label for="f-acts-${k}">Hele dag of nog niet ingedeeld</label><textarea id="f-acts-${k}" name="activities" placeholder="Activiteiten zonder vast moment">${esc(d.activities)}</textarea><small>Eén activiteit per regel, in elk vak.</small></div>
    <div class="field"><label for="f-tr-${k}">Transport</label><input id="f-tr-${k}" name="transport" value="${esc(d.transport)}" placeholder="Alleen als jullie van plek veranderen, bv. Bus Siem Reap → Battambang, 14:00"></div>
    <div class="field"><label for="f-notes-${k}">Notities</label><textarea id="f-notes-${k}" name="notes" placeholder="Tips, vertrekuren, …">${esc(d.notes)}</textarea></div>
    <p class="err" data-err hidden></p>
    <div class="actions">
      <div><button class="primary" type="submit">Opslaan</button><button type="button" data-cancel>Annuleren</button></div>
      ${isNew ? "" : `<button type="button" class="danger" data-del="${esc(d.date)}">${confirmDel === d.date ? "Zeker? Klik nogmaals om te verwijderen" : "Dag verwijderen"}</button>`}
    </div>
  </form>`;
}

function render() {
  renderRoute();
  $days.innerHTML = (!days.length && editing !== "new")
    ? '<div class="notice">Nog geen dagen in het reisplan.</div>'
    : days.map(viewDay).join("") + (editing === "new"
      ? `<article class="day"><div class="date"><span class="dow">nieuw</span></div><div class="body">${formHtml({ __new: true })}</div></article>` : "");
  $("adder").hidden = !editMode || editing === "new";
  $("modeBtn").textContent = editMode ? "Klaar" : "Bewerken";
  $("modeBtn").hidden = !sb || offline || !$("codeForm").hidden;
  $("dlBtn").hidden = !!OFFLINE_COPY || !days.length;
}

function formErr(f, msg) { const p = f?.querySelector("[data-err]"); if (p) { p.textContent = msg; p.hidden = false; } }
function errText(e) {
  const m = String(e?.message || "");
  if (m.includes("wrong_code")) return "De bewerkcode klopt niet meer. Klik op Klaar en ontgrendel opnieuw.";
  if (/fetch|network/i.test(m)) return "Geen verbinding. Controleer je internet en probeer opnieuw.";
  return "Opslaan lukte niet: " + (m || "onbekende fout");
}

async function load() {
  let res;
  try { res = await sb.from("trip_days").select("*").order("date"); } catch (e) { res = { error: e }; }
  if (res.error) {
    if (!navigator.onLine || /fetch|network/i.test(String(res.error.message || ""))) { goOffline(); return false; }
    banner("De reisgegevens konden niet geladen worden. Controleer SUPABASE_URL en SUPABASE_KEY in index.html."); return false;
  }
  days = res.data.map(r => ({ ...r, date: String(r.date).slice(0, 10) }));
  writeCache();
  if (offline) { offline = false; banner(""); }
  status("Live", true);
  if (!editing) render(); else renderRoute();
  return true;
}

async function rpc(name, args) {
  const { error } = await sb.rpc(name, args);
  if (error) throw error;
}

$days.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t || busy) return;
  if (t.dataset.edit) { editing = t.dataset.edit; confirmDel = null; render(); $("f-place-" + editing)?.focus(); }
  else if (t.hasAttribute("data-cancel")) { editing = null; confirmDel = null; render(); }
  else if (t.dataset.del) {
    const id = t.dataset.del, f = t.closest("form");
    if (confirmDel !== id) { confirmDel = id; render(); return; }
    busy = true;
    try { await rpc("delete_day", { p_code: code, p_date: id }); editing = null; confirmDel = null; await load(); }
    catch (err) { formErr(f, errText(err)); }
    busy = false;
  }
});

$days.addEventListener("submit", async (e) => {
  e.preventDefault(); if (busy) return;
  const f = e.target, key = f.dataset.form, fd = new FormData(f);
  const date = key === "new" ? String(fd.get("date") || "") : key;
  if (!date) return formErr(f, "Kies een datum.");
  if (key === "new" && days.some(d => d.date === date)) return formErr(f, "Er bestaat al een dag op deze datum. Bewerk die dag in plaats daarvan.");
  const g = n => String(fd.get(n) || "").trim();
  const day = { date, place: g("place"), stay: g("stay"), address: g("address"), activities: g("activities"), morning: g("morning"), afternoon: g("afternoon"), evening: g("evening"), transport: g("transport"), notes: g("notes") };
  const btn = f.querySelector('button[type="submit"]');
  busy = true; btn.disabled = true; btn.textContent = "Opslaan…";
  try { await rpc("save_day", { p_code: code, p_day: day }); editing = null; confirmDel = null; await load(); }
  catch (err) { btn.disabled = false; btn.textContent = "Opslaan"; formErr(f, errText(err)); }
  busy = false;
});

$("modeBtn").addEventListener("click", async () => {
  if (editMode) { editMode = false; editing = null; confirmDel = null; render(); return; }
  if (code) {
    try { const { data } = await sb.rpc("check_code", { p_code: code }); if (data === true) { editMode = true; render(); return; } } catch {}
  }
  $("codeForm").hidden = false; render(); $("codeInput").focus();
});
$("codeCancel").addEventListener("click", () => { $("codeForm").hidden = true; render(); });
$("codeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = $("codeInput").value.trim();
  const { data, error } = await sb.rpc("check_code", { p_code: val });
  if (error || data !== true) { status("Die code klopt niet."); return; }
  code = val; try { localStorage.setItem(CODE_KEY, val); } catch {}
  $("codeInput").value = ""; $("codeForm").hidden = true; editMode = true;
  status("Live", true); render();
});
$("addBtn").addEventListener("click", () => { editing = "new"; render(); $("f-date-new")?.focus(); });

function loadPdfLib() {
  if (window.html2pdf) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js";
    s.onload = ok; s.onerror = fail; document.head.appendChild(s);
  });
}

$("dlBtn").addEventListener("click", async () => {
  const btn = $("dlBtn"); if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "PDF maken…";
  const prev = [editMode, editing, document.documentElement.getAttribute("data-theme")];
  try {
    await loadPdfLib();
    editMode = false; editing = null; render();
    document.documentElement.setAttribute("data-theme", "light");
    document.body.classList.add("exporting");
    await window.html2pdf().set({
      margin: [10, 8, 12, 8],
      filename: "Cambodja-reisplan.pdf",
      image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: "#F2F5F1" },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"], avoid: [".day", "header"] },
      enableLinks: true
    }).from(document.querySelector(".wrap")).save();
    status("PDF gedownload.");
  } catch {
    status("De PDF kon niet gemaakt worden. Controleer je internet en probeer opnieuw.");
  } finally {
    document.body.classList.remove("exporting");
    if (prev[2]) document.documentElement.setAttribute("data-theme", prev[2]); else document.documentElement.removeAttribute("data-theme");
    editMode = prev[0]; editing = prev[1]; render();
    btn.disabled = false; btn.textContent = "Download als PDF";
  }
});

(async () => {
  if (OFFLINE_COPY) {
    days = sortDays(FALLBACK); render();
    banner(`<b>Offline versie.</b> Dit is de planning zoals ze was op ${esc(fmtTime(OFFLINE_COPY))}. Wijzigingen van daarna staan hier niet in.`);
    return;
  }
  if (!SUPABASE_URL || !SUPABASE_KEY) {
    days = sortDays(FALLBACK); render();
    banner("<b>Nog niet gekoppeld.</b> Vul SUPABASE_URL en SUPABASE_KEY in bovenaan het script in index.html om samen te bewerken. Je ziet nu de reservekopie.");
    return;
  }
  const cached = readCache();
  if (cached) { days = sortDays(cached.days); render(); }
  else { $days.innerHTML = '<div class="notice">Reisplan laden…</div>'; }
  if (!window.supabase || !navigator.onLine) { goOffline(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  window.__sb = sb; window.__initDocs?.();
  status("Laden…");
  await load();
  sb.channel("trip_days")
    .on("postgres_changes", { event: "*", schema: "public", table: "trip_days" }, () => load())
    .subscribe();
  window.addEventListener("offline", () => goOffline());
  window.addEventListener("online", () => load());
})();
</script>
<script>
/* ============================================================
   REISDOCUMENTEN — ID's en rijbewijzen achter een aparte code.
   De bestanden staan in Supabase; deze pagina bevat ze niet.
   ============================================================ */
(() => {
  const PEOPLE = ["Lander", "Mini", "Jarne", "Sander", "Rudy", "Eti"];
  const KINDS = [["id", "Identiteitskaart"], ["rijbewijs", "Rijbewijs"]];
  const DOC_KEY = "cambodja-doccode"; // alleen voor dit tabblad (sessionStorage)
  const lockIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
  const fileIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

  const box = document.getElementById("docs");
  let docCode = null, docs = {}, busyKey = null, confirmKey = null, msg = "";
  try { docCode = sessionStorage.getItem(DOC_KEY); } catch {}

  const k = (p, kind) => p + "/" + kind;
  const ERR = {
    wrong_code: "Die code klopt niet.",
    locked: "Te veel foute pogingen. Probeer het over 15 minuten opnieuw.",
    too_large: "Dit bestand is te groot. Gebruik een foto of een kleinere PDF (max. ongeveer 5 MB).",
    bad_type: "Gebruik een foto (JPG, PNG) of een PDF.",
    not_found: "Dit document bestaat niet meer. Vernieuw de pagina."
  };

  function fmtSize(n) { return n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB"; }

  async function call(name, args) {
    if (!window.__sb) throw { code: "offline" };
    const { data, error } = await window.__sb.rpc(name, { p_code: docCode, ...args });
    if (error) throw { code: /fetch|network/i.test(error.message || "") ? "offline" : "server", message: error.message };
    if (data && data.error) throw { code: data.error };
    return data;
  }
  function errMsg(e) {
    if (e?.code === "offline") return "Documenten zijn alleen beschikbaar met internet.";
    return ERR[e?.code] || "Er ging iets mis" + (e?.message ? ": " + e.message : ". Probeer opnieuw.");
  }

  function renderLocked() {
    box.innerHTML = `
      <div class="docs-head"><h2 class="docs-title">Reisdocumenten</h2></div>
      <form class="docs-lock" id="docsUnlock">
        <span class="docs-lock-icon">${lockIcon}</span>
        <div class="docs-lock-body">
          <label for="docCodeInput"><b>ID's en rijbewijzen</b> zijn afgeschermd met een aparte code.</label>
          <div class="docs-lock-row">
            <input id="docCodeInput" type="password" autocomplete="off" placeholder="Documentcode" required>
            <button class="primary" type="submit">Ontgrendel</button>
          </div>
          ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
        </div>
      </form>`;
    document.getElementById("docsUnlock").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true; btn.textContent = "Controleren…";
      docCode = document.getElementById("docCodeInput").value;
      await refresh(true);
    });
  }

  function renderOpen() {
    const cards = PEOPLE.map(p => `
      <div class="person">
        <h3>${esc(p)}</h3>
        ${KINDS.map(([kind, label]) => {
          const d = docs[k(p, kind)], key = k(p, kind), busy = busyKey === key;
          return `<div class="docrow">
            <div class="docinfo">
              <span class="doclabel">${label}</span>
              ${d ? `<span class="docmeta">${fileIcon}${esc(d.mime === "application/pdf" ? "PDF" : "Foto")} · ${fmtSize(d.size)}</span>`
                  : '<span class="docmeta empty">Nog niet toegevoegd</span>'}
            </div>
            <div class="docbtns">
              ${busy ? '<span class="status">Bezig…</span>' : d ? `
                <button type="button" data-view="${key}">Bekijk</button>
                <button type="button" class="ghost" data-up="${key}">Vervang</button>
                <button type="button" class="ghost danger" data-del="${key}">${confirmKey === key ? "Zeker?" : "Verwijder"}</button>`
              : `<button type="button" data-up="${key}">Upload</button>`}
            </div>
          </div>`;
        }).join("")}
      </div>`).join("");
    box.innerHTML = `
      <div class="docs-head">
        <h2 class="docs-title">Reisdocumenten</h2>
        <button type="button" class="ghost" id="docsLock">${lockIcon}<span>Vergrendel</span></button>
      </div>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
      <div class="people">${cards}</div>
      <p class="docs-note">Bestanden worden alleen getoond na het ingeven van de code en worden niet in de PDF of op dit toestel bewaard. Vergrendel na gebruik op een gedeeld toestel.</p>
      <input type="file" id="docFile" accept="image/jpeg,image/png,image/webp,image/heic,application/pdf" hidden>`;
  }

  function render() {
    if (!window.__sb) { box.innerHTML = '<div class="docs-head"><h2 class="docs-title">Reisdocumenten</h2></div><div class="notice">Documenten zijn alleen beschikbaar met internet.</div>'; return; }
    if (docCode) renderOpen(); else renderLocked();
  }

  async function refresh(fromUnlock) {
    try {
      const r = await call("docs_list", {});
      docs = {}; for (const d of r.docs || []) docs[k(d.person, d.kind)] = d;
      msg = ""; try { sessionStorage.setItem(DOC_KEY, docCode); } catch {}
    } catch (e) {
      if (e.code === "wrong_code" || e.code === "locked") { docCode = null; try { sessionStorage.removeItem(DOC_KEY); } catch {} }
      msg = fromUnlock || e.code !== "wrong_code" ? errMsg(e) : "";
    }
    render();
    if (fromUnlock && !docCode) document.getElementById("docCodeInput")?.focus();
  }

  function b64ToBlob(b64, mime) {
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function blobToB64(blob) {
    return new Promise((ok, fail) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = fail; r.readAsDataURL(blob);
    });
  }
  // Foto's worden verkleind (max. 2000 px) zodat ze snel laden en klein blijven.
  function shrinkImage(file) {
    return new Promise((ok, fail) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? ok(b) : fail({ code: "bad_type" }), "image/jpeg", 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); fail({ code: "bad_type" }); };
      img.src = url;
    });
  }

  let uploadTarget = null;
  box.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.id === "docsLock") {
      docCode = null; docs = {}; msg = ""; try { sessionStorage.removeItem(DOC_KEY); } catch {}
      closeViewer(); render(); return;
    }
    if (busyKey) return;
    if (t.dataset.up) { uploadTarget = t.dataset.up; confirmKey = null; const f = document.getElementById("docFile"); f.value = ""; f.click(); return; }
    if (t.dataset.del) {
      const key = t.dataset.del;
      if (confirmKey !== key) { confirmKey = key; render(); return; }
      const [person, kind] = key.split("/");
      busyKey = key; confirmKey = null; render();
      try { await call("docs_delete", { p_person: person, p_kind: kind }); delete docs[key]; msg = ""; }
      catch (err) { msg = errMsg(err); }
      busyKey = null; render(); return;
    }
    if (t.dataset.view) {
      const key = t.dataset.view, [person, kind] = key.split("/");
      busyKey = key; render();
      try {
        const r = await call("docs_get", { p_person: person, p_kind: kind });
        openViewer(person + " · " + (kind === "id" ? "Identiteitskaart" : "Rijbewijs"), b64ToBlob(r.data, r.mime), r.filename);
        msg = "";
      } catch (err) { msg = errMsg(err); }
      busyKey = null; render();
    }
  });

  box.addEventListener("change", async (e) => {
    if (e.target.id !== "docFile" || !uploadTarget) return;
    const file = e.target.files[0]; if (!file) return;
    const key = uploadTarget, [person, kind] = key.split("/");
    busyKey = key; msg = ""; render();
    try {
      let blob = file, mime = file.type;
      if (mime === "application/pdf") { if (file.size > 5.5e6) throw { code: "too_large" }; }
      else { blob = await shrinkImage(file); mime = "image/jpeg"; }
      const data = await blobToB64(blob);
      await call("docs_put", { p_person: person, p_kind: kind, p_filename: file.name, p_mime: mime, p_data: data });
      docs[key] = { person, kind, mime, size: blob.size, filename: file.name };
    } catch (err) { msg = errMsg(err); }
    busyKey = null; uploadTarget = null; render();
  });

  // Viewer: toont een foto groot op de pagina; een PDF opent in een nieuw tabblad.
  const viewer = document.getElementById("docViewer");
  let viewUrl = null;
  function openViewer(title, blob, filename) {
    closeViewer();
    viewUrl = URL.createObjectURL(blob);
    const isPdf = blob.type === "application/pdf";
    viewer.innerHTML = `
      <div class="viewer-card" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="viewer-bar">
          <b>${esc(title)}</b>
          <div class="viewer-actions">
            <a class="btnlink" href="${viewUrl}" download="${esc(filename || "document")}">Download</a>
            ${isPdf ? `<a class="btnlink" href="${viewUrl}" target="_blank" rel="noopener">Open PDF</a>` : ""}
            <button type="button" class="primary" id="viewerClose">Sluiten</button>
          </div>
        </div>
        <div class="viewer-body">${isPdf
          ? '<p class="docs-note">Dit is een PDF. Klik op "Open PDF" om ze te bekijken.</p>'
          : `<img src="${viewUrl}" alt="${esc(title)}">`}</div>
      </div>`;
    viewer.hidden = false;
    document.getElementById("viewerClose").focus();
  }
  function closeViewer() {
    viewer.hidden = true; viewer.innerHTML = "";
    if (viewUrl) { setTimeout(((u) => () => URL.revokeObjectURL(u))(viewUrl), 60000); viewUrl = null; }
  }
  viewer.addEventListener("click", (e) => { if (e.target === viewer || e.target.id === "viewerClose") closeViewer(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !viewer.hidden) closeViewer(); });

  window.__initDocs = () => { render(); if (docCode) refresh(false); };
  if (window.__sb) window.__initDocs(); else render();
})();
</script>
</body>
</html>
